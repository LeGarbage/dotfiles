general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = sleep 1 && hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"   # to avoid having to press a key twice to turn on the display.
    inhibit_sleep = 3
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = hyprctl hyprsunset gamma 35     # dim screen
    on-resume = hyprctl hyprsunset reset         # monitor backlight restore.
}

listener { 
    timeout = 150                                              # 2.5min.
    ignore_inhibit = true                                      # the keyboard backlight should always be turned off
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd tpacpi::kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 420                                                                               # 7min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"                             # screen off when timeout has passed
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })" && hyprctl hyprsunset reset   # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                                                                               # 10min
    on-timeout = systemctl suspend                                                              # sleep
}
